[project]
name = "robomodel"
version = "0.1.0"
description = "Build mathematical models (Fossen 6-DOF) of robots from CAD and a vehicle description"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Arda Onur Kirik" }
]
requires-python = ">=3.12"
dependencies = [
    "cascadio>=0.1.1",
    "fastapi>=0.165.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "trimesh>=5.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
robomodel = "robomodel.cli:main"

[project.optional-dependencies]
bem = [
    "capytaine>=3.0.0",
    "fast-simplification>=0.2.0",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Heavy tests (big CAD files, several GB of RAM) run only with: pytest -m heavy
markers = ["heavy: needs big downloaded CAD files and several GB of memory"]
addopts = "-m 'not heavy'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"validation/*" = ["E501"]  # long Turkish report text
"src/robomodel/web.py" = ["B008"]  # FastAPI declares uploads as File(...) defaults
