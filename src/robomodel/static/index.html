<title>robomodel – CAD → matematiksel model</title>
<style>

  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); margin:2px 0 12px; }
  .lang button { padding:3px 9px; font-size:12px; }
  .intro { background:var(--soft); border-radius:10px; padding:10px 12px; margin:6px 0 4px; font-size:13px; }
  .intro ol { margin:4px 0 0 18px; padding:0; }
  .step { border-top:1px solid var(--line); margin-top:16px; padding-top:12px; }
  .step h2 { font-size:15px; margin:0 0 2px; display:flex; gap:8px; align-items:center; }
  .num { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:12px; font-weight:700; }
  .why { color:var(--muted); font-size:12.5px; margin:0 0 8px; }
  label { display:block; margin:8px 0 2px; font-size:12.5px; font-weight:600; }
  label small { font-weight:400; color:var(--muted); }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
                  font:inherit; background:#fff; }
  input:focus, select:focus { outline:2px solid #b6d1ff; border-color:var(--accent); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .row3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:6px; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:7px; background:#fff;
           font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#aab4c0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); width:100%;
                   padding:11px; font-weight:650; margin-top:16px; font-size:15px; }
  button.active { background:#eaf2ff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:12.5px; margin:6px 0; }
  .types { display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:6px; }
  .types button { text-align:left; padding:8px 10px; line-height:1.25; }
  .types button b { display:block; font-size:13px; }
  .types button span { color:var(--muted); font-size:11.5px; }
  .types button.active { background:#eaf2ff; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  body.air .wateronly { display:none !important; }
  body:not(.air) .aironly { display:none !important; }
  .soon { display:inline-block; background:#eef0f3; color:var(--muted); border-radius:8px; padding:0 6px; font-size:10.5px; margin-left:4px; }
  .size { background:#eef7ee; border-radius:7px; padding:6px 9px; font-size:12.5px; margin-top:8px; display:none; }
  .size.bad { background:#fff1f0; }
  details.adv { margin-top:8px; } details.adv summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  .item { border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin:6px 0; }
  .item header { display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  .item header button { padding:2px 8px; font-size:12px; }
  #view { width:100%; height:100%; display:block; background:#eef1f5; }
  #legend { position:absolute; top:10px; left:12px; background:rgba(255,255,255,.92);
            border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; }
  #legend b.x { color:#d22; } #legend b.y { color:#1a8f2a; } #legend b.z { color:#2550d8; }
  #empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted);
           font-size:15px; pointer-events:none; text-align:center; padding:20px; }
  #result { position:absolute; top:0; right:0; bottom:0; width:min(860px, 74%); overflow:auto;
            background:var(--panel); border-left:1px solid var(--line); padding:20px 24px 40px;
            box-shadow:-8px 0 24px rgba(0,0,0,.08); display:none; z-index:5; }
  #result h3 { margin:0 0 6px; font-size:20px; }
  #result h4 { margin:20px 0 6px; font-size:14px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  #result .close { position:sticky; top:0; float:right; font-size:18px; padding:2px 10px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:10px; margin-top:8px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; }
  .card .k { color:var(--muted); font-size:12px; } .card .v { font-size:17px; font-weight:650; margin-top:2px; }
  .card .r { color:var(--muted); font-size:12px; margin-top:2px; }
  .card.ok { border-left:4px solid var(--ok); } .card.warn { border-left:4px solid #d4a72c; } .card.fail { border-left:4px solid var(--fail); }
  .todo { background:#fffbe8; border:1px solid #f0e2a8; border-radius:10px; padding:8px 12px 8px 30px; }
  .todo li { margin:3px 0; }
  .trust { background:var(--soft); border-radius:10px; padding:8px 12px; font-size:13px; }
  table { border-collapse:collapse; width:100%; margin:6px 0 4px; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; background:#f8f9fb; }
  .src { color:var(--muted); font-size:11.5px; }
  .eq { background:#f3f5f8; border-radius:6px; padding:6px 10px; font-family:ui-monospace, monospace; font-size:12.5px; }
  .badge { display:inline-block; min-width:44px; text-align:center; border-radius:10px; padding:0 6px;

  .badge.ok { background:#dafbe1; color:var(--ok); } .badge.warn { background:#fff8c5; color:var(--warn); }
  .badge.fail { background:#ffebe9; color:var(--fail); }
  .check { margin:3px 0; }
  pre { background:#f3f5f8; padding:10px; border-radius:6px; overflow:auto; font-size:12px; }
  #status { margin-top:10px; font-size:12.5px; color:var(--muted); min-height:1.4em; }
  .err { color:var(--fail); white-space:pre-wrap; }
  a.dl button { width:auto; margin:4px 0 0; }

<body>
<aside>
  <header class="top">
    <h1>robomodel</h1>
    <span class="lang"><button data-lang="tr">TR</button> <button data-lang="en">EN</button></span>
  </header>
  <p class="sub" data-i18n="tagline"></p>
  <div class="intro"><b data-i18n="howTitle"></b>
    <ol><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li></ol>
  </div>
  <section class="step">
    <h2><span class="num">0</span><span data-i18n="s0"></span></h2>
    <p class="why" data-i18n="s0why"></p>
    <div class="types" id="types"></div>
  </section>
  <button id="example" style="width:100%;margin-top:10px" data-i18n="example"></button>

  <section class="step">
    <h2><span class="num">1</span><span data-i18n="s1"></span></h2>
    <p class="why" data-i18n="s1why"></p>
    <input type="file" id="cad" accept=".stl,.step,.stp,.obj,.ply">
    <div class="size" id="sizeinfo"></div>
    <div class="row">
      <div><label><span data-i18n="units"></span></label>
        <select id="unit"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option></select></div>
      <div class="wateronly"><label><span data-i18n="water"></span></label>
        <select id="water"><option value="fresh" data-i18n="fresh"></option><option value="sea" data-i18n="sea"></option></select></div>
    </div>
    <p class="hint" data-i18n="axesWhy"></p>
    <div class="row">
      <div><label data-i18n="fwd"></label><select id="fwd"></select></div>
      <div><label data-i18n="up"></label><select id="up"></select></div>
    </div>
    <details class="adv"><summary data-i18n="advanced"></summary>
      <label><input type="checkbox" id="assembly" style="width:auto"> <span data-i18n="assembly"></span></label>
      <div class="row">
        <div><label data-i18n="voxel"></label><input id="voxel" type="number" value="4" min="0.5" step="0.5"></div>
        <div class="wateronly"><label data-i18n="hydro"></label>
          <select id="hydro"><option value="auto">auto</option><option value="slender" data-i18n="slender"></option><option value="frame" data-i18n="frameOpt"></option></select></div>
      </div>
    </details>
  </section>

  <section class="step">
    <h2><span class="num">2</span><span data-i18n="s2"></span></h2>
    <p class="why" data-i18n="s2why"></p>
    <div class="row">
      <div><label data-i18n="name"></label><input id="name" value="my_vehicle"></div>
      <div><label><span data-i18n="mass"></span> <small>kg</small></label><input id="mass" type="number" step="0.01"></div>
    </div>
    <label><span data-i18n="speed"></span> <small>m/s</small></label><input id="speed" type="number" value="1.0" step="0.1">
    <details class="adv"><summary data-i18n="measuredTitle"></summary>
      <div class="wateronly"><label><span data-i18n="mvol"></span> <small>m³</small></label><input id="mvol" type="number" step="0.0001"></div>
      <label><span data-i18n="cg"></span> <small>m</small></label>
      <div class="row3"><input id="cgx" type="number" step="0.001" placeholder="x"><input id="cgy" type="number" step="0.001" placeholder="y"><input id="cgz" type="number" step="0.001" placeholder="z"></div>
    </details>
  </section>

  <section class="step">
    <h2><span class="num">3</span><span data-i18n="s3"></span></h2>
    <p class="why" data-i18n="s3why"></p>
    <div class="tools">
      <button data-mode="thruster" class="wateronly" data-i18n="addThruster"></button>
      <button data-mode="fin" class="wateronly" data-i18n="addFin"></button>
      <button data-mode="rotor" class="aironly" data-i18n="addRotor"></button>
      <button data-mode="part" data-i18n="addPart"></button>
    </div>
    <div class="hint" id="modehint"></div>
    <div id="items"></div>
  </section>

  <button class="primary" id="build" disabled data-i18n="build"></button>
  <button id="showresult" style="width:100%;margin-top:6px;display:none" data-i18n="showResults"></button>
  <div id="status"></div>
  <p class="hint" style="margin-top:18px"><span data-i18n="privacy"></span>
    <a href="#" id="deletefiles" style="display:none" data-i18n="deleteNow"></a></p>
</aside>

<main>
  <canvas id="view"></canvas>
  <div id="empty" data-i18n="emptyView"></div>
  <div id="legend"><span data-i18n="axes"></span>: <b class="x" data-i18n="axX"></b> · <b class="y" data-i18n="axY"></b> · <b class="z" data-i18n="axZ"></b></div>
  <section id="result"></section>
</main>

function axisVec(name) { const v = new THREE.Vector3(); v[name[1]] = name[0] === "-" ? -1 : 1; return v; }
function bodyAxes() {
  const x = axisVec($("fwd").value), up = axisVec($("up").value);
  if (Math.abs(x.dot(up)) > 0.5) return null;
  const z = up.clone().negate(), y = new THREE.Vector3().crossVectors(z, x);
  const name = (v) => (v.x + v.y + v.z < 0 ? "-" : "") + (Math.abs(v.x) ? "x" : Math.abs(v.y) ? "y" : "z");

}
function applyTransform() {
  const ax = bodyAxes();
  if (!ax) { status(lang === "tr" ? "Ön ve üst farklı eksenler olmalı." : "Forward and up must be different axes.", true); return; }
  const s = UNIT[$("unit").value];
  const m = new THREE.Matrix4().set(
    ax.x.x * s, ax.x.y * s, ax.x.z * s, 0,
    ax.y.x * s, ax.y.y * s, ax.y.z * s, 0,
    ax.z.x * s, ax.z.y * s, ax.z.z * s, 0, 0, 0, 0, 1);
  root.matrixAutoUpdate = false; root.matrix.copy(m); root.updateMatrixWorld(true);
  if (!cadMesh) return;
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3());
  size = box.getSize(new THREE.Vector3()).length();
  if (axesHelper) scene.remove(axesHelper);
  axesHelper = new THREE.Group();
  [[1,0,0],[0,1,0],[0,0,1]].forEach((d, i) => axesHelper.add(new THREE.ArrowHelper(
    new THREE.Vector3(...d), new THREE.Vector3(0,0,0), size * 0.45, [0xdd2222, 0x1a8f2a, 0x2550d8][i], size*0.06, size*0.03)));
  scene.add(axesHelper);
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(-size, size * 0.9, -size * 0.6));

}
let fileExtents = null;
function showSize() {

  const ax = bodyAxes(); if (!ax) return;
  const s = UNIT[$("unit").value];
  const along = (v) => Math.abs(v.x) * fileExtents[0] + Math.abs(v.y) * fileExtents[1] + Math.abs(v.z) * fileExtents[2];
  const L = along(ax.x) * s, W = along(ax.y) * s, H = along(ax.z) * s;
  const odd = Math.max(L, W, H) > 50 || Math.max(L, W, H) < 0.02;
  box.style.display = "block"; box.classList.toggle("bad", odd);
  box.textContent = t("sizeOk", { L: L.toPrecision(3), W: W.toPrecision(3), H: H.toPrecision(3) }) + (odd ? t("sizeBad") : "");
}

let uploadId = null;
$("cad").addEventListener("change", async (e) => {

  status(t("uploading", { f: file.name, mb: (file.size / 2**20).toFixed(1) }));
  const form = new FormData(); form.append("file", file);
  const up = await fetch("/api/upload", { method: "POST", body: form });
  if (!up.ok) return status(await errorText(up), true);
  uploadId = (await up.json()).id;
  await loadPreview(file.name);
});
$("example").addEventListener("click", async () => {

  $("unit").value = ex.spec.unit; $("fwd").value = ex.spec.forward; $("up").value = ex.spec.up;

      const disk = new THREE.Mesh(new THREE.CircleGeometry(r, 32), new THREE.MeshBasicMaterial({ color: it.spin === "cw" ? 0x2e7dd7 : 0xd7472e, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
      disk.position.copy(p); marks.add(disk);  // the circle lies in body x-y
      marks.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), p, s * 0.12, 0xff7a00, s * 0.04, s * 0.025));
    }
    if (it.kind === "part") { const m = new THREE.Mesh(new THREE.SphereGeometry(s * 0.02), new THREE.MeshBasicMaterial({ color: 0x00a0a0 })); m.position.copy(p); marks.add(m); }
  }
}

// ---------- build ----------
function num(id) { const v = $(id).value; return v === "" ? null : +v; }
function spec() {
  const ax = bodyAxes();
  const s = { name: $("name").value || "vehicle", category: CATEGORY[robotType], mass: num("mass"), water: $("water").value,
    speed: num("speed") ?? 1.0,
    geometry: { unit: $("unit").value, axes: ax ? ax.yaml : ["x", "y", "z"], assembly: $("assembly").checked,
                voxel: num("voxel") ?? 4, hydrodynamics: $("hydro").value, origin: "center" } };
  const measured = {};
  if (num("mvol")) measured.volume = num("mvol");
  if ([num("cgx"), num("cgy"), num("cgz")].every((v) => v !== null)) measured.r_g = [num("cgx"), num("cgy"), num("cgz")];
  if (Object.keys(measured).length) s.measured = measured;
  const thr = items.filter((i) => i.kind === "thruster").map((x) => {
    const o = { model: x.model || "custom", position: x.position, direction: vecFrom(x.direction) };
    if (x.max_forward !== "") o.max_forward = x.max_forward;
    if (x.max_reverse !== "") o.max_reverse = x.max_reverse;
    return o;
  });
  if (thr.length && robotType !== "drone") s.thrusters = thr;
  const rotors = items.filter((i) => i.kind === "rotor").map((x) => {
    const o = { position: x.position, spin: x.spin, max_thrust: x.max_thrust === "" ? null : x.max_thrust, diameter: (+x.diameter_in || 0) * 0.0254 };
    if (x.motor_g !== "" && +x.motor_g > 0) o.motor_mass = x.motor_g / 1000;
    return o;
  });
  if (rotors.length && robotType === "drone") s.rotors = rotors;
  if (robotType === "drone") { delete s.water; s.air = 1.225; delete s.geometry.hydrodynamics; }
  const fins = items.filter((i) => i.kind === "fin").map((f) => ({ name: f.name, position: f.position,
    normal: vecFrom(f.normal), area: f.area_cm2 / 1e4, span: f.span_cm / 100, control: !!f.control }));
  if (fins.length) s.fins = fins;
  const parts = items.filter((i) => i.kind === "part").map((p) => ({ name: p.name, mass: p.mass, position: p.position }));
  if (parts.length) s.parts = parts;
  return s;
}
let lastResult = null;
$("build").addEventListener("click", async () => {
  if (!num("mass")) return status(t("needMass"), true);
  $("build").disabled = true; status(t("building"));
  const res = await fetch(`/api/build/${uploadId}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(spec()) });
  $("build").disabled = false;
  if (!res.ok) return status(await errorText(res), true);
  lastResult = await res.json(); status(t("done")); showResult(lastResult, true);
});

// ---------- results ----------
const DOF = ["u", "v", "w", "p", "q", "r"];
function n(v, d = 3) { const x = +v; if (!isFinite(x)) return "–"; if (Math.abs(x) < 1e-15) return "0";
  return Math.abs(x) >= 1e4 || Math.abs(x) < 1e-3 ? x.toExponential(2) : x.toPrecision(d); }
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }
function card(kind, k, v, r = "") { return `<div class="card ${kind}"><div class="k">${k}</div><div class="v">${v}</div>${r ? `<div class="r">${r}</div>` : ""}</div>`; }
function rangeCard(b, key, label, unit, factor = 1) {
  const x = b[key]; if (!x || x.nominal === undefined) return "";
  const vals = [x.low, x.nominal, x.high].filter((v) => v !== undefined).map((v) => v * factor);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return card("", label, `${n(x.nominal * factor)} ${unit}`, hi - lo > 1e-9 * Math.abs(hi) ? t("rangeLbl", { a: n(lo), b: n(hi) }) + ` ${unit}` : "");
}
function checkName(c) { if (lang !== "tr") return c.name; const k = Object.keys(CHECK_TR).find((p) => c.name.includes(p)); return k ? CHECK_TR[k] : c.name; }
function showResult(r, open) {
  const m = r.model, b = r.behaviour || {}, box = $("result");
  const status = (part) => (r.checks.find((c) => c.name.includes(part)) || {}).status;
  const fails = r.checks.filter((c) => c.status === "fail").length;
  const net = m.buoyancy.value - m.weight.value, pct = (100 * net / m.weight.value);
  const bg = (m.r_g.value[2] - m.r_b.value[2]) * 100;
  const fl = m.floating && m.floating.summary;
  const surfaceCards = fl ? [
    card("ok", t("draftK"), t("draftV", { d: n(parseFloat(fl.draft)), f: n(parseFloat(fl.freeboard)) })),
    card(status("stable in roll") === "ok" ? "ok" : "fail", t("gmK"), status("stable in roll") === "ok"
      ? t("gmOk", { gm: n(100 * parseFloat(fl["GM_T, GM_L"]), 3), deg: parseFloat(fl["stable up to"]) }) : t("gmNo")),
  ] : [];
  const hv = m.hover;
  const airCards = hv ? [
    card(status("can hover") === "ok" ? "ok" : "fail", t("hoverK"), hv.possible ? t("hoverOk", { tw: n(hv.thrust_to_weight, 3) }) : t("hoverNo")),
  ] : [];
  const water = !fl && !hv;
  const cards = [
    card(fails ? "fail" : "ok", t("validK"), fails ? t("validNo") : t("validOk")),
    ...surfaceCards, ...airCards,
    !water ? "" : card(Math.abs(pct) < 0.5 ? "ok" : "warn", t("buoyancyK"),
      Math.abs(pct) < 0.5 ? t("buoyNeutral") : (net > 0 ? t("buoyUp", { n: n(net), p: n(Math.abs(pct), 2) }) : t("buoyDown", { n: n(net), p: n(Math.abs(pct), 2) }))),
    !water ? "" : card(status("self-righting") === "ok" ? "ok" : "warn", t("rightK"), status("self-righting") === "ok" ? t("rightOk", { cm: n(bg, 2) }) : t("rightNo")),
    hv ? "" : card(status("directionally stable") === "ok" ? "ok" : "warn", t("stabK"), status("directionally stable") === "ok" ? t("stabOk") : t("stabNo")),
    rangeCard(b, "top_speed", t("speedK"), "m/s"),
    rangeCard(b, "turn_rate_fins", t("turnK"), "°/s", 180 / Math.PI),
    rangeCard(b, "turn_rate_thrusters", t("turnK"), "°/s", 180 / Math.PI),
    rangeCard(b, "vertical_speed", t("vertK"), "m/s"),
    rangeCard(b, "hover_throttle", t("throttleK"), "%", 100),
    rangeCard(b, "climb_speed", t("climbK"), "m/s"),
    rangeCard(b, "heave_period", t("heaveK"), "s"),
    rangeCard(b, "roll_period", t("rollK"), "s"),
    rangeCard(b, "pitch_period", t("pitchK"), "s"),
  ].join("");
  const w = r.warnings.join(" | ");
  const todo = [];
  if (fails) todo.push(t("tFail"));
  if (/units/.test(w)) todo.push(t("tUnits"));
  if (/not neutrally buoyant/.test(w)) todo.push(t("tBuoy"));
  if (/self-righting/.test(w)) todo.push(t("tRight"));
  if (/no thrusters/.test(w)) todo.push(t("tThr"));
  if (/preset/.test(w)) todo.push(t("tPreset"));
  if (/tilted/.test(w)) todo.push(t("tTilt"));
  if (/closed holes|voxels|inside other solids|duplicate/.test(w)) todo.push(t("tRepair"));
  if (/separate bodies/.test(w)) todo.push(t("tSep"));
  if (/height of the centre of gravity/.test(w)) todo.push(t("tCG"));
  if (/Froude/.test(w)) todo.push(t("tFroude"));
  if (/no parts listed/.test(w)) todo.push(t("tParts"));
  if (/thrust stand/.test(w)) todo.push(t("tStand"));
  if (/thrust falling with airspeed/.test(w)) todo.push(t("tAirspeed"));
  todo.push(t("tCal"));
  const diag = (M) => M.value.map((row, i) => row[i]);
  const inertia = diag(m.inertia_g);
  const perAxis = [
    [t("inertiaRow"), [null, null, null, ...inertia], m.inertia_g.source],
    [t("addedRow"), diag(m.M_A), m.M_A.source],
    [t("linRow"), m.D_linear.value, m.D_linear.source],
    [t("quadRow"), m.D_quadratic.value, m.D_quadratic.source],
  ];
  const matrix = (mat, title) => `<table><tr><th>${title}</th>${DOF.map((l) => `<th>${l}</th>`).join("")}</tr>` +
    mat.map((row, i) => `<tr><td>${DOF[i]}</td>${row.map((x) => `<td>${n(x, 4)}</td>`).join("")}</tr>`).join("") + "</table>";
  box.innerHTML = `
    <button class="close" title="close">×</button>
    <h3>${esc(t("resTitle", { name: m.name }))}</h3>
    <a class="dl" href="/api/download/${uploadId}/${r.result}"><button class="primary">${t("download")}</button></a>
    <h4>${t("summary")}</h4><div class="cards">${cards}</div>
    <h4>${t("todo")}</h4><ol class="todo">${todo.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
    <h4>${t("trustTitle")}</h4><div class="trust">${t("trustText")}</div>
    <h4>${t("checks")}</h4>
    ${r.checks.map((c) => `<div class="check"><span class="badge ${c.status}">${c.status}</span>${esc(checkName(c))} <span class="src">${esc(c.detail)}</span></div>`).join("")}
    ${r.warnings.length ? `<h4>${t("warnings")}</h4>${r.warnings.map((x) => `<div class="check src">⚠ ${esc(x)}</div>`).join("")}` : ""}
    <h4>${t("details")}</h4>
    <p class="eq">M ν̇ + C(ν) ν + D(ν) ν + g(η) = τ,  M = M_RB + M_A</p>
    <table>
      <tr><td>${t("massRow")}</td><td>${n(m.mass.value, 4)} kg</td></tr>
      <tr><td>${t("volRow")}</td><td>${n(m.volume.value, 4)} m³ <span class="src">${m.volume.source}</span></td></tr>
      <tr><td>${t("wbRow")}</td><td>${n(m.weight.value, 4)} N / ${n(m.buoyancy.value, 4)} N</td></tr>
      <tr><td>${t("cgRow")}</td><td>[${m.r_g.value.map((x) => n(x)).join(", ")}] m <span class="src">${m.r_g.source}</span></td></tr>
      <tr><td>${t("cbRow")}</td><td>[${m.r_b.value.map((x) => n(x)).join(", ")}] m</td></tr>
    </table>
    <table><tr><th>${t("perAxis")}</th>${DOF.map((d) => `<th>${d}</th>`).join("")}<th>${t("sourceCol")}</th></tr>
      ${perAxis.map(([label, vals, src]) => `<tr><td>${label}</td>${vals.map((v) => `<td>${v === null ? "" : n(v)}</td>`).join("")}<td class="src">${src}</td></tr>`).join("")}
    </table>
    <details><summary>${t("matrices")}</summary>${matrix(m.M_RB, "M_RB")}${matrix(m.M_A.value, "M_A")}</details>
    <details><summary>${t("fullReport")}</summary><pre>${esc(r.report)}</pre></details>`;
  if (open) box.style.display = "block";
  box.querySelector(".close").onclick = () => { box.style.display = "none"; };
  $("showresult").style.display = "block";
  $("showresult").onclick = () => { box.style.display = "block"; };
}

async function errorText(res) {
  try { const j = await res.json(); return (j.detail || JSON.stringify(j)); } catch { return `${res.status} ${res.statusText}`; }
}
function status(msg, err = false) { $("status").innerHTML = ""; const d = document.createElement("div"); d.textContent = msg; if (err) d.className = "err"; $("status").append(d); }
applyLang(); resize();
</script>
</body>
</html>
